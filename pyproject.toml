[project]
name = "spendwise-mcp"
version = "0.1.0"
description = "Local AI expense-tracking agent built with LangChain, FastMCP, and DeepSeek"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "fastmcp>=3.3.1",
    "langchain>=1.3.2",
    "langchain-deepseek>=1.0.1",
    "langchain-google-genai>=4.2.3",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "mcp>=1.27.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
